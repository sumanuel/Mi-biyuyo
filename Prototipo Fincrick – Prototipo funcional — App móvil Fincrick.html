  <style>

    #__bundler_loading { position: fixed; bottom: 20px; right: 20px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, sans-serif; color: #666; background: #fff; padding: 8px 14px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.12); z-index: 10000; }
    #__bundler_thumbnail { position: fixed; inset: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #faf9f5; z-index: 9999; }
    #__bundler_thumbnail svg { width: 100%; height: 100%; object-fit: contain; }
    #__bundler_placeholder { color: #999; font-size: 14px; }
  </style>
  <noscript>

    <div style="position:fixed;bottom:12px;left:12px;font:13px/1.4 -apple-system,BlinkMacSystemFont,sans-serif;color:#999;background:rgba(255,255,255,0.9);padding:6px 12px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,0.08);z-index:10000;">

    </div>

<body>
  <div id="__bundler_placeholder">Loading Prototipo Fincrick...</div>
  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

s-serif; color: #2B2233;\">\n\n  <div style=\"position: sticky; top: 12px; height: 0; z-index: 50; display: flex; justify-content: center;\">\n    <sc-if value=\"{{ hasAviso }}\" hint-placeholder-val=\"{{ false }}\">\n      <div role=\"status\" style=\"background: #2B2233; color: #FFFFFF; font-size: 14px; font-weight: 700; padding: 11px 18px; border-radius: 12px; box-shadow: 0 8px 24px rgba(43,34,51,0.35);\">{{ aviso }}<\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; align-items: flex-end; justify-content: space-between; gap: 40px; padding-bottom: 18px; border-bottom: 3px solid #5B2A86; margin-bottom: 12px;\">\n    <div>\n      <img src=\"531ba807-3296-4fad-b8b8-2efcc4522111\" alt=\"Fincrick\" style=\"height: 34px; display: block; margin-bottom: 8px;\">\n      <div style=\"color: #6B6274; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 14px;\">Finanzas personales<\u002Fdiv>\n      <div style=\"font-size: 30px; font-weight: 800; letter-spacing: -0.6px;\">Prototipo funcional — App móvil Fincrick<\u002Fdiv>\n      <div style=\"color: #6B6274; font-size: 14px; margin-top: 6px; max-width: 660px; line-height: 20px;\">Recorrido completo, con estado real y compartido entre pantallas: lo que registras en un frame se refleja en los demás. Datos ficticios de la demo.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex: none; background: #FFFFFF; border: 1px solid #D9CFE3; border-radius: 12px; padding: 14px 16px; min-width: 320px;\">\n      <div style=\"font-size: 10px; font-weight: 800; letter-spacing: 0.6px; color: #6B6274; text-transform: uppercase; margin-bottom: 10px;\">Sesión de la demo<\u002Fdiv>\n      <div style=\"font-size: 14px; font-weight: 800;\">{{ sesionNombre }}<\u002Fdiv>\n      <div style=\"color: #6B6274; font-size: 12.5px; margin-top: 2px;\">{{ sesionDetalle }}<\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; margin-top: 12px;\">\n        <button sc-camel-on-click=\"{{ resetDemo }}\" style=\"flex: 1; text-align: center; background: #FFFFFF; border: 1.5px solid #D9CFE3; border-radius: 8px; padding: 9px 10px; font-size: 12.5px; font-weight: 800; color: #2B2233;\">Reiniciar demo<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"background: #FFFFFF; border: 1px solid #D9CFE3; border-radius: 14px; padding: 20px 22px 22px; margin-top: 28px;\">\n    <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 4px;\">\n      <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 1px; color: #5B2A86;\">GUION DE PRESENTACIÓN<\u002Fdiv>\n      <div style=\"color: #6B6274; font-size: 13px;\">13 pasos · ~11 minutos · toca un paso para saltar a la pantalla<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"color: #6B6274; font-size: 13px; line-height: 19px; max-width: 760px; margin-bottom: 16px;\">Recorrido de los primeros minutos de una persona con la app: de la apertura al primer registro, su plan del mes y su primera meta. Antes de empezar, toca <strong style=\"color: #2B2233;\">Reiniciar demo<\u002Fstrong> para que el estado arranque limpio.<\u002Fdiv>\n    <div style=\"display: flex; gap: 10px; flex-wrap: wrap;\">\n      <sc-for list=\"{{ guion }}\" as=\"g\" hint-placeholder-count=\"10\">\n        <a href=\"{{ g.href }}\" style=\"flex: none; width: 218px; text-decoration: none; color: #2B2233; background: #FFFFFF; border: 1px solid #D9CFE3; border-radius: 12px; padding: 12px 13px;\">\n          <div style=\"display: flex; align-items: center; gap: 7px; margin-bottom: 7px;\">\n            <div style=\"background: #EADCF7; color: #4A1F70; font-size: 10px; font-weight: 800; border-radius: 999px; padding: 3px 7px; flex: none;\">{{ g.n }}<\u002Fdiv>\n            <div style=\"font-size: 9.5px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: #4A1F70;\">{{ g.tag }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13.5px; font-weight: 800; margin-bottom: 4px;\">{{ g.titulo }}<\u002Fdiv>\n          <div style=\"color: #6B6274; font-size: 12px; line-height: 17px;\">{{ g.desc }}<\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 56px 48px; margin-top: 44px;\">\n\n    <!-- 00 SPLASH -->\n    <div id=\"f00\" style=\"flex: none; width: 360px;\">\n      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 10px;\">\n        <div style=\"background: #EADCF7; color: #4A1F70; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 3px 9px;\">00<\u002Fdiv>\n        <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #4A1F70;\">Splash<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width: 360px; height: 760px; border: 10px solid #1F1A26; border-radius: 40px; background: #5B2A86; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;\">\n        <div style=\"flex-grow: 1; display: flex; align-items: center; justify-content: center;\">\n          <img src=\"6ac2089d-1253-413c-b22e-63a0772cc5ef\" alt=\"Fincrick\" style=\"width: 340px; height: 340px; object-fit: cover;\">\n        <\u002Fdiv>\n        <a href=\"#f01\" style=\"display: block; text-align: center; color: #FFFFFF; font-size: 14px; font-weight: 700; padding: 22px; min-height: 44px;\">Toca para continuar<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- 01 BIENVENIDA -->\n    <div id=\"f01\" style=\"flex: none; width: 360px;\">\n      <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 10px;\">\n        <div style=\"background: #EADCF7; color: #4A1F70; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 3px 9px;\">01<\u002Fdiv>\n        <div style=\"font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #4A1F70;\">Bienvenida<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"width: 360px; height: 760px; borde \n      const len = totalD > 0 ? (v / totalD) * CD : 0;\n      const seg = { fill, dash: len.toFixed(1) + ' ' + (CD - len).toFixed(1), off: '-' + cum.toFixed(1) };\n      cum += len;\n      return seg;\n    });\n    const tabTipo = s.anTab;\n    const tabTotal = tabTipo === 'ingreso' ? aI : tabTipo === 'gasto' ? aG : aA;\n    const tabFill = { ingreso: '#62AF1C', gasto: '#E87E67', ahorro: '#34B7BB' }[tabTipo] || '#62AF1C';\n    const catAgg = {};\n    if (kMes === 1 && tabTipo !== 'resumen') s.movs.filter((m) => m.tipo === tabTipo).forEach((m) => { catAgg[m.cat] = (catAgg[m.cat] || 0) + m.monto; });\n    const catsTab = Object.keys(catAgg).map((k) => ({ cat: k, monto: catAgg[k] })).sort((a, b) => b.monto - a.monto)\n      .map((c) => ({ cat: c.cat, montoTxt: this.fmt(c.monto), share: tabTotal > 0 ? Math.round((c.monto / tabTotal) * 100) : 0, fill: tabFill }));\n    const historial = s.movs.map((m) => {\n      const t = tipoStyle[m.tipo];\n      return { cat: m.cat, fecha: m.fecha, tipoLbl: t.lbl, bg: t.bg, color: t.color, ini: m.cat.charAt(0).toUpperCase(), montoTxt: t.sign + this.fmt(m.monto) };\n    });\n\n    const guion = [\n      { href: '#f00', n: '01', tag: 'Apertura', titulo: '00 Splash', desc: 'La marca abre la app.' },\n      { href: '#f01', n: '02', tag: 'Bienvenida', titulo: '01 Bienvenida', desc: 'Cuatro mensajes y a comenzar. Toca Siguiente.' },\n      { href: '#f02', n: '03', tag: 'Ingreso', titulo: '02 Login', desc: 'Toca el usuario de prueba para autocompletar. Valida correo y contraseña.' },\n      { href: '#f03', n: '04', tag: 'Alta', titulo: '03 Registro de cuenta', desc: 'Datos, PIN por e-mail (1234) y confirmación.' },\n      { href: '#f04', n: '05', tag: 'Inicio', titulo: '04 Inicio', desc: 'Saldo, nivel, barras real vs plan y últimos movimientos.' },\n      { href: '#f10', n: '06', tag: 'Análisis', titulo: '10 Análisis', desc: 'Ver detalles: meses, saldo final, gráfico de barras o pastel y categorías.' },\n      { href: '#f05', n: '07', tag: 'Registro', titulo: '05 Registro', desc: 'Elige Ingresos, Gastos o Ahorros y toca una categoría. También puedes crear una.' },\n      { href: '#f11', n: '08', tag: 'Nuevo registro', titulo: '11 Nuevo registro', desc: 'Anota el monto y guarda: suma puntos y actualiza el 04 y el 10.' },\n      { href: '#f12', n: '09', tag: 'Categoría', titulo: '12 Nueva categoría', desc: 'Nombre, descripción, macro (en gastos) e icono. Aparece en el 05 al guardar.' },\n      { href: '#f06', n: '10', tag: 'Plan', titulo: '06 Planificación', desc: 'Planifica octubre desde cero o copiando un mes.' },\n      { href: '#f07', n: '11', tag: 'Metas', titulo: '07 Metas', desc: 'Bloqueadas hasta el nivel 2. Diseña una meta y abónala.' },\n      { href: '#f08', n: '12', tag: 'Avisos', titulo: '08 Notificaciones', desc: 'Léelas: la campana y las sugerencias del 04 se actualizan.' },\n      { href: '#f09', n: '13', tag: 'Cierre', titulo: '09 Mi espacio', desc: 'Puntos, nivel y menú. Cerrar sesión vuelve al login.' }\n    ];\n\n    const fuera = (label) => () => this.aviso(label + ' — fuera del alcance de este prototipo');\n    const menuItems = ['Conciliación', 'Ajustes', 'Ingresos y gastos permanentes', 'Automatiza registro', 'Desafiliar'].map((label) => ({ label, pick: fuera(label) }));\n\n    return {\n      // globales\n      hasAviso: !!s.aviso, aviso: s.aviso, guion,\n      sesionNombre: s.logged ? nombreCompleto : 'Sin sesión iniciada',\n      sesionDetalle: s.logged ? 'camila@ejemplo.com · Nivel ' + nivel + ' · ' + s.puntos + ' pts' : 'Inicia sesión en el frame 02',\n      resetDemo: () => { clearTimeout(this._t); this.setState(this.initial()); this.aviso('Demo reiniciada'); },\n      // bienvenida\n      slide: slides[wi], dots, welcomeBtn: ultimaSlide ? 'Comenzar' : 'Siguiente',\n      welcomeNext: () => { if (ultimaSlide) { this.setState({ wIdx: 0 }); this.aviso('Sigue con el login — frame 02'); } else { this.setState({ wIdx: wi + 1 }); } },\n      // login\n      email: s.email, pass: s.pass, errEmail: s.errEmail, errPass: s.errPass,\n      onEmail: (e) => this.setState({ email: e.target.value, errEmail: '' }),\n      onPass: (e) => this.setState({ pass: e.target.value, errPass: '' }),\n      fillTestUser: () => this.setState({ email: 'camila@ejemplo.com', pass: 'fincrick123', errEmail: '', errPass: '' }),\n      doLogin: () => {\n        const okEmail = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(s.email);\n        const okPass = s.pass.length >= 8;\n        this.setState({ errEmail: okEmail ? '' : (s.email ? 'Por favor, ingrese un email válido.' : 'Por favor, ingrese su email.'), errPass: okPass ? '' : 'La contraseña debe tener al menos 8 caracteres.' });\n        if (okEmail && okPass) { this.setState({ logged: true }); this.aviso('Sesión iniciada — sigue en Inicio (frame 04)'); }\n      },\n      noop: () => this.aviso('Recuperar contraseña — fuera del alcance de este prototipo'),\n      socialGoogle: () => this.aviso('Ingreso con Google — fuera del alcance de este prototipo'),\n      socialApple: () => this.aviso('Ingreso con Apple — fuera del alcance de este prototipo'),\n      socialFacebook: () => this.aviso('Ingreso con Facebook — fuera del alcance de este prototipo'),\n      // registro de cuenta\n      regStep1: s.regStep === 1, regStep2: s.regStep === 2, regStep3: s.regStep === 3,\n      rNombre: s.rNombre, rEmail: s.rEmail, rPass: s.rPass, rPin: s.rPin, rErr: s.rErr,\n      rEmailShown: s.rEmail || 'tu correo',\n      onRNombre: (e) => this.setState({ rNombre: e.target.value, rErr: '' }),\n      onREmail: (e) => this.setState({ rEmail: e.target.value, rErr: '' }),\n      onRPass: (e) => this.setState({ rPass: e.target.value, rErr: '' }),\n      onRPin: (e) => this.setState({ rPin: e.target.value, rErr: '' }),\n      doRegister: () => {\n        if (!s.rNombre.trim()) { this.setState({ rErr: 'Por favor, ingrese su nombre.' }); return; }\n        if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(s.rEmail)) { this.setState({ rErr: 'Por favor, ingrese un email válido.' }); return; }\n        if (s.rPass.length < 8) { this.setState({ rErr: 'La contraseña debe tener al menos 8 caracteres.' }); return; }\n        this.setState({ regStep: 2, rErr: '' });\n      },\n      doVerify: () => {\n        if (s.rPin.trim() === '1234') { this.setState({ regStep: 3, rErr: '' }); }\n        else { this.setState({ rErr: 'PIN incorrecto. Prueba con 1234.' }); }\n      },\n      // home\n      nombreCorto: 'Camila', iniciales: 'CR', nivel, puntos: s.puntos, maxPuntos,\n      nombreNivel: nivel === 1 ? 'Iniciante' : 'Nivel 2',\n      ringDash: (prog * C).toFixed(1) + ' ' + C.toFixed(1),\n      saldoTxt: this.fmt(saldo), barras, ultimos,\n      hayNoLeidas: noLeidas > 0, noLeidas,\n      haySugerencia: !!sug, sugerencia,\n      verDetalles: () => this.aviso('Análisis de tus finanzas — fuera del alcance de este prototipo'),\n      tabsHome: this.tabs('inicio'), tabsReg: this.tabs('registro'), tabsPlan: this.tabs('planifica'), tabsMetas: this.tabs('metas'), tabsEsp: this.tabs('espacio'),\n      // registro de movimiento\n      catLabel: s.cat || 'Seleccionar', catColor: s.cat ? '#3F1B61' : '#6B6274',\n      catsView, esGasto: s.tipo === 'gasto', tileBg, tipoNuevo: tipoNuevos[s.tipo],\n      tituloNueva: tituloNuevas[s.tipo], iconGrid, sheetOpts, sheetOpen: s.cSheet,\n      cDesc: s.cDesc, cErrDesc: s.cErrDesc,\n      macroTxt: s.cMacro || 'Selecciona macro categoría', macroColor: s.cMacro ? '#2B2233' : '#8A8194',\n      onCDesc: (e) => this.setState({ cDesc: e.target.value }),\n      openSheet: () => this.setState({ cSheet: true }),\n      closeSheet: () => this.setState({ cSheet: false }),\n      catIcon: ICONS[selIdx >= 0 ? iconIdx(s.cat, selIdx) : 0],\n      addCat: s.addCat, notAddCat: !s.addCat, cNombre: s.cNombre, cErr: s.cErr,\n      onCNombre: (e) => this.setState({ cNombre: e.target.value, cErr: '' }),\n      toggleAddCat: () => this.setState({ addCat: !s.addCat, cNombre: '', cErr: '' }),\n      configCats: () => this.aviso('Configurar categorías — fuera del alcance de este prototipo'),\n      saveCat: () => {\n        const name = s.cNombre.trim();\n        if (!name) { this.setState({ cErr: 'Ingrese el nombre de la categoría', cErrDesc: 'Debe ingresar un nombre a la categoría.' }); return; }\n        if (lista.some((c) => c.name.toLowerCase() === name.toLowerCase())) { this.setState({ cErr: 'Esa categoría ya existe', cErrDesc: 'Elige otro nombre para la categoría.' }); return; }\n        if (s.cIcon < 0) { this.setState({ cErr: 'Elige un icono', cErrDesc: 'Debe elegir un icono para la categoría.' }); return; }\n        if (s.tipo === 'gasto' && !s.cMacro) { this.setState({ cErr: 'Selecciona macro categoría', cErrDesc: 'Debes seleccionar si la categoría es Esenciales, Variables o Por definir.' }); return; }\n        const cats = { ...s.cats, [s.tipo]: s.cats[s.tipo].concat([{ name, desc: s.cDesc, icon: s.cIcon, tag: s.tipo === 'gasto' ? s.cMacro : '' }]) };\n        this.setState({ cats, cat: name, cNombre: '', cDesc: '', cIcon: -1, cMacro: '', cErr: '', cErrDesc: '' });\n        this.aviso('Categoría «' + name + '» creada — aparece en Registro (frame 05)');\n      },\n      tiposReg, monto: s.monto, nota: s.nota, regErr: s.regErr,\n      onMonto: (e) => this.setState({ monto: this.digits(e.target.value), regErr: '' }),\n      onNota: (e) => this.setState({ nota: e.target.value }),\n      guardarMov: () => {\n        const m = Number(s.monto) || 0;\n        if (m <= 0) { this.setState({ regErr: 'Debe ingresar un monto' }); return; }\n        if (!s.cat) { this.setState({ regErr: 'Selecciona una categoría' }); return; }\n        this.commitMov(s.tipo, s.cat, m, { monto: '', cat: '', nota: '', regErr: '' });\n      },\n      // planificación\n      planIngTxt: this.fmt(PLAN.ing), planGasTxt: this.fmt(PLAN.gas), planAhoTxt: this.fmt(PLAN.aho),\n      puedePlanificar: !octPlanificado, metodos, planes,\n      pIng: s.pIng, pGas: s.pGas, pAho: s.pAho, planErr: s.planErr,\n      onPIng: (e) ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];\n        const fecha = d.length === 3 ? meses[Number(d[1]) - 1] + ' ' + d[0] : s.gFecha;\n        this.setState({ metas: s.metas.concat([{ id: s.nextMeta, nombre: s.gNombre.trim(), objetivo: Number(s.gMonto), ahorrado: 0, fecha }]), nextMeta: s.nextMeta + 1, crear: false, gErr: '' });\n        this.aviso('Creaste una meta ¡Esfuérzate en conseguirla por ti!');\n      },\n      // notificaciones\n      notifNoLeidas: nNo, notifLeidas: nSi, hayLeidas: nSi.length > 0, sinNoLeidas: nNo.length === 0,\n      notifResumen: nNo.length === 0 ? 'Estás al día' : nNo.length + (nNo.length === 1 ? ' sin leer' : ' sin leer'),\n      borrarTodo: () => { this.setState({ notifs: [] }); this.aviso('Notificaciones borradas'); },\n      // análisis\n      saldoColor: aSaldo >= 0 ? '#30540F' : '#992B13', saldoShort: short(aSaldo),\n      saldoAbsShort: short(Math.abs(aSaldo)), saldoDir: aSaldo >= 0 ? 'a favor' : 'en contra',\n      meses, anTabs, chips, ticks, bars, donut, catsTab, sinCatsTab: catsTab.length === 0,\n      mesLargo: mesesL[s.mes],\n      verBarras: s.anTab === 'resumen' && s.chartMode === 'barras',\n      verPastel: s.anTab === 'resumen' && s.chartMode === 'pastel',\n      verLista: s.anTab !== 'resumen',\n      chartBtn: s.chartMode === 'barras' ? 'Barras' : 'Pastel',\n      toggleChart: () => this.setState({ chartMode: s.chartMode === 'barras' ? 'pastel' : 'barras' }),\n      hist: s.hist, historial, histBtn: s.hist ? 'Ocultar historial' : 'Ver historial',\n      toggleHist: () => this.setState({ hist: !s.hist }),\n      // mi espacio\n      nombreCompleto, menuItems,\n      cerrarSesion: () => { this.setState({ logged: false, email: '', pass: '', errEmail: '', errPass: '' }); this.aviso('Sesión cerrada — vuelves al login (frame 02)'); }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
