<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Mi Biyuyo · Administración</title>
    <style>
      :root { color-scheme: light dark; --bg:#f4f7f5; --card:#fff; --text:#13271e; --mut:#5c6f66; --line:#d9e2dd; --acc:#1f7a59; --bad:#b3261e; }
      @media (prefers-color-scheme: dark) { :root { --bg:#0f1a15; --card:#17261f; --text:#e8f1ec; --mut:#9db1a6; --line:#27392f; --acc:#3fb58a; --bad:#ff8a80; } }
      * { box-sizing: border-box; }
      body { margin:0; font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); }
      header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:14px 16px; border-bottom:1px solid var(--line); background:var(--card); }
      header h1 { font-size:17px; margin:0; flex:1; }
      main { max-width:980px; margin:0 auto; padding:16px; display:grid; gap:14px; }
      nav { display:flex; flex-wrap:wrap; gap:8px; }
      button, select, input, textarea { font:inherit; color:inherit; }
      button { border:1px solid var(--line); background:var(--card); padding:8px 14px; border-radius:10px; cursor:pointer; }
      button.pri { background:var(--acc); color:#fff; border-color:var(--acc); }
      button.bad { color:var(--bad); border-color:var(--bad); }
      button.on { outline:2px solid var(--acc); }
      input, select, textarea { padding:8px 10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); max-width:100%; }
      textarea { width:100%; min-height:80px; }
      .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:8px; }
      .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
      .mut { color:var(--mut); font-size:13px; }
      .bad { color:var(--bad); }
      .tag { display:inline-block; padding:2px 8px; border-radius:999px; background:var(--bg); border:1px solid var(--line); font-size:12px; }
      img.proof { max-width:100%; max-height:420px; border-radius:10px; border:1px solid var(--line); }
      #msg { min-height:20px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Mi Biyuyo · Administración</h1>
      <div id="auth" class="row"></div>
    </header>
    <main>
      <div id="msg" class="mut" role="status"></div>
      <nav id="tabs"></nav>
      <section id="view"></section>
    </main>
    <script src="/admin/admin.js"></script>
  </body>
</html>
